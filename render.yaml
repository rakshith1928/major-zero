# Render free-tier backend for ZeroBus (no GCP billing needed)
# Connect https://github.com/rakshith1928/major-zero.git in render.com -> New -> Blueprint
services:
  - type: web
    name: zerobus-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: HF_HUB_OFFLINE
        value: 1
      - key: TRANSFORMERS_OFFLINE
        value: 1
      - key: DATABASE_URL
        sync: false # paste Supabase postgresql+psycopg2 URL in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: FERNET_MASTER
        generateValue: true
      - key: TICKET_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://college-project-c6b6a.web.app
      - key: WEBAUTHN_RP_ID
        value: college-project-c6b6a.web.app
      - key: WEBAUTHN_ORIGIN
        value: https://college-project-c6b6a.web.app
      - key: ADMIN_EMAILS
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false # paste sk-or-v1... from openrouter.ai in Render dashboard; empty = stub rules
      - key: OPENROUTER_MODEL
        value: openrouter/free
